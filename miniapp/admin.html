<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Bozorchi AI · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: auto; overflow: auto; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    .method { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 700; font-size: 12px; border-top: 0; }
    td.n, th.n { text-align: right; white-space: nowrap; }
    .z { font-weight: 800; color: var(--alert); }
    .pill-alert { display: inline-block; background: var(--alert-soft); color: var(--alert); font-weight: 800; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
    .ok { background: var(--positive-soft); color: var(--positive); }
    .sel { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 18px; }
    .toplist { margin: 6px 0 0; padding-left: 18px; }
    .toplist li { margin: 2px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr"><div class="hdr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
      <div><h1>Bozorchi AI · Bazaar admin</h1><p>Anomalies · trends · seller reliability · personalisation — computed live from the data</p></div></div>
    <div class="sel" id="provinces"></div>
    <div id="view" class="grid"><div class="spinner"></div></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
